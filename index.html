<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todo-card">
    <header class="header">
      <h1>Minhas Tarefas</h1>
      <p>Organize o seu dia</p>
    </header>

    <ul class="task-list">
      <li class="task-item done">
        <label>
          <input type="checkbox" checked disabled>
          <span>Aprender estrutura básica de HTML</span>
        </label>
      </li>
      <li class="task-item done">
        <label>
          <input type="checkbox" checked disabled>
          <span>Estilizar elementos com CSS</span>
        </label>
      </li>
      <li class="task-item">
        <label>
          <input type="checkbox" disabled>
          <span>Criar repositório no GitHub</span>
        </label>
      </li>
      <li class="task-item">
        <label>
          <input type="checkbox" disabled>
          <span>Subir o primeiro commit</span>
        </label>
      </li>
      <li class="task-item">
        <label>
          <input type="checkbox" disabled>
          <span>Explorar  utilização da ferramente </span>
        </label>
      </li>
    </ul>
  </main>
</body>
</html>
